apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-fp050-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-fp050-app
  template:
    metadata:
      labels:
        app: devops-fp050-app
    spec:
      containers:
        - name: python-app
          image: devops-fp050-app:develop
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
